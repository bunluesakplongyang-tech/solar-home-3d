name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build.py
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/solar-home-3d.js --clobber
        env:
          GH_TOKEN: ${{ github.token }}
